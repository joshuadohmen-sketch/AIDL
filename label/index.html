<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI-DTL Label</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #c61a27;
      --black: #000000;
      --white: #ffffff;
      --g100: #f5f5f5;
      --g200: #e8e8e8;
      --g400: #6e6e6e;
      --g700: #333333;
      --font: 'Open Sans', Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--g100); color: var(--black); font-size: 18px; line-height: 1.6; }

    .site-header {
      background: var(--black); padding: 0 2rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
    }
    .site-header::after {
      content: ''; display: block; position: absolute;
      top: 64px; left: 0; right: 0; height: 3px; background: var(--red);
    }
    .logo-area { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .uk-mark {
      font-family: var(--font); font-weight: 800; font-size: 1.2rem;
      color: var(--white); letter-spacing: 1.5px; border-left: 3px solid var(--red); padding-left: 10px;
    }
    .header-sub { font-size: .68rem; font-weight: 400; color: rgba(255,255,255,.45); letter-spacing: .4px; }
    .header-sub em { font-style: normal; color: rgba(255,255,255,.28); margin-left: 6px; }
    @media (max-width: 560px) { .header-sub { display: none; } }
    .lang-switch { display: flex; gap: 4px; }
    .lang-switch button {
      font-family: var(--font); font-size: .72rem; font-weight: 600; letter-spacing: .5px;
      background: none; border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.5);
      padding: 4px 10px; cursor: pointer; border-radius: 2px; transition: all .15s;
    }
    .lang-switch button.active { background: var(--red); border-color: var(--red); color: var(--white); }

    .page { max-width: 700px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    .badge-hero { text-align: center; padding: 2.5rem 0 2rem; }
    .badge-hero svg { max-width: 100%; }
    .label-string {
      font-family: 'Courier New', monospace; font-size: .95rem; font-weight: 700;
      background: var(--white); border: 1px solid var(--g200); border-radius: 4px;
      padding: .6rem 1rem; margin-top: 1.2rem; display: inline-block; word-break: break-all;
    }

    .dim-card {
      background: var(--white); border: 1px solid var(--g200); border-radius: 6px;
      padding: 1.2rem 1.5rem; margin-bottom: .75rem;
      display: flex; align-items: center; gap: 1.2rem;
    }
    .dim-icon {
      width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--black); color: var(--white);
    }
    .dim-icon svg { width: 28px; height: 28px; }
    .page-sub { font-size: .85rem; color: var(--g400); margin-bottom: .5rem; }
    .legacy-note {
      background: var(--white); border: 1px solid var(--g200); border-radius: 6px;
      padding: .8rem 1.2rem; margin-bottom: .75rem; font-size: .85rem; color: var(--g700);
    }
    .dim-body { flex: 1; }
    .dim-code { font-family: 'Courier New', monospace; font-size: .75rem; font-weight: 700; color: var(--g400); letter-spacing: .5px; }
    .dim-title { font-size: .95rem; font-weight: 700; margin: 2px 0; }
    .dim-desc { font-size: .82rem; color: var(--g700); line-height: 1.45; }

    .tool-info {
      background: var(--white); border: 1px solid var(--g200); border-radius: 6px;
      padding: 1.2rem 1.5rem; margin-bottom: .75rem; font-size: .9rem; color: var(--g700);
    }
    .tool-info strong { color: var(--black); }

    .cta { text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--g200); }
    .cta a {
      display: inline-block; background: var(--red); color: var(--white);
      text-decoration: none; font-weight: 700; font-size: .85rem;
      padding: .6rem 1.5rem; border-radius: 4px; letter-spacing: .3px; transition: opacity .15s;
    }
    .cta a:hover { opacity: .85; }
    .cta p { margin-top: .6rem; font-size: .75rem; color: var(--g400); }

    .error { text-align: center; padding: 4rem 1rem; color: var(--g400); }
    .error h2 { font-size: 1.2rem; color: var(--black); margin-bottom: .5rem; }

    footer {
      margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--g200);
      font-size: .72rem; color: var(--g400);
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem;
    }
    footer a { color: var(--g700); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 560px) {
      .page { padding: 1.5rem 1rem 3rem; }
      .dim-card { flex-direction: column; text-align: center; gap: .6rem; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <a class="logo-area" href="../">
    <span class="uk-mark">AI-DTL</span>
    <span class="header-sub">AI Disclosure &amp; Transparency Label <em>v 0.4.1</em></span>
  </a>
  <div class="lang-switch">
    <button id="btn-de" class="active" onclick="setLang('de')">DE</button>
    <button id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</header>

<main class="page">
  <div id="content"></div>
  <footer>
    <span>AI-DTL Working Draft 0.4.1 · Oktober 2026 · <a href="../changelog/">Changelog</a></span>
    <span>
      <a href="https://creativecommons.org/licenses/by/4.0" target="_blank">CC BY 4.0</a> ·
      DOI folgt (Zenodo) ·
      <a href="https://github.com/joshuadohmen-sketch/AIDL/issues" target="_blank">Feedback</a> ·
      <a href="mailto:jdohmen@uni-koblenz.de">Joshua Dohmen</a>
    </span>
  </footer>
</main>

<script src="../js/icons.js"></script>
<script src="../js/spec.js"></script>
<script src="../js/label-core.js"></script>
<script>
// Explanation page 0.4.1. Texts from js/spec.js, parsing and checks from js/label-core.js.
// Everything taken from the URL is set as text; codes come only from the positive list.
let lang = 'de';

function setLang(l) {
  lang = l;
  document.getElementById('btn-de').classList.toggle('active', l === 'de');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.documentElement.lang = l;
  renderPage();
}

// Small DOM helper: el('div', { className: 'x' }, child, 'text', …)
function el(tag, props, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, props || {});
  children.forEach(c => { if (c != null) node.append(c); });
  return node;
}

function renderDimCard(t, code) {
  const icon = el('div', { className: 'dim-icon' });
  // ICONS is a fixed in-page table and code is from the positive list
  icon.innerHTML = `<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">${ICONS[code].replace(/currentColor/g, '#ffffff')}</svg>`;
  return el('div', { className: 'dim-card' },
    icon,
    el('div', { className: 'dim-body' },
      el('div', { className: 'dim-code' }, code),
      el('div', { className: 'dim-title' }, t.dims[code].title),
      el('div', { className: 'dim-desc' }, t.dims[code].desc)));
}

function renderPage() {
  // This page shows 0.4 labels; 0.5 labels live under rc/label/ until release.
  const parsed = LabelCore.fromParams(new URLSearchParams(window.location.search));
  const p = parsed && parsed.v === '0.4' ? parsed : null;
  const t = SPEC['0.4'].i18n[lang];
  const root = document.getElementById('content');
  const cta = withSub => el('div', { className: 'cta' },
    el('a', { href: '../' }, t.page.create_own),
    withSub ? el('p', {}, t.page.create_sub) : null);

  if (!p) {
    root.replaceChildren(
      el('div', { className: 'error' }, el('h2', {}, t.page.invalid), el('p', {}, t.page.invalid_sub)),
      cta(false));
    document.title = 'AI-DTL – ' + t.page.invalid;
    return;
  }

  const s = p.state;
  // Old links may lack dates or carry N/Acc:N, so the code is assembled for display here.
  const toolPart = s.tools.length ? ` (${s.tools.map(x => x.name + (x.date ? `, ${x.date}` : '')).join('; ')})` : '';
  const label = s.stamm === 'N'
    ? `AI-DTL 0.4: N/${s.acc}`
    : `AI-DTL 0.4: ${s.stamm}/${s.host};${s.review};${s.acc}${toolPart}`;
  document.title = 'AI-DTL – ' + label;

  const badge = el('div');
  badge.innerHTML = buildBadgeSVG(s, '0.4');

  const dims = s.stamm === 'N' ? [s.stamm, s.acc] : [s.stamm, s.host, s.review, s.acc];
  const nodes = [
    el('div', { className: 'badge-hero' },
      el('p', { className: 'page-sub' }, t.page.page_sub),
      badge,
      el('div', { className: 'label-string' }, label)),
  ];
  if (p.legacyNAccN) nodes.push(el('div', { className: 'legacy-note' }, t.page.legacy_n_accn));
  dims.forEach(code => nodes.push(renderDimCard(t, code)));
  if (s.tools.length) {
    const list = s.tools.map(x => x.name + (x.date ? ` (${x.date})` : '')).join('; ');
    nodes.push(el('div', { className: 'tool-info' }, el('strong', {}, t.page.tool_used + ':'), ' ' + list));
  }
  nodes.push(cta(true));
  root.replaceChildren(...nodes);
}

renderPage();
</script>
</body>
</html>
